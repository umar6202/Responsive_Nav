<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query navbar</title>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Font Poppins -->
    <!-- add Poppins in  font-family CSS style tag: -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, 'Times New Roman', Times, serif;
        }

        ul {
            display: flex;
            justify-content: center;
            gap: 10px;
            list-style: none;
        }

        a, i{
            text-decoration: none;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        a:hover {
            background: lightcoral;
            opacity: 0.7;
        }

        .logo{
            font-weight: bold;
            font-size: 1.2rem;
        }

        header{
            display: flex;
            justify-content: space-between;
            /* align-items: center; */
            padding: 25px 15px;
            background: linear-gradient(20deg, tomato, navy);
            box-shadow: 5px 5px 10px lightcoral;
            border-radius: 0 0 10px 10px;
        }

        /* Hide checkbox and hamburger by default */
        #btn, .menu-icon{
            display: none;
        }

        /* mobile ViewPort  */
        @media (max-width: 756px) {
             header{
                flex-wrap: wrap;
             }

             .menu-icon{
                display: block;
             }

             nav{
                width: 100%;
                display: none;
             }

             ul{
                flex-direction: column;
                align-items: flex-start;
                padding: 10px 0;
             }

             #btn:checked ~ nav{
                display: block;
             }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <a href="#" class="logo">Logo <span>Brand</span></a>
        </div>

        <!--Hamburger  -->
        
        <input type="checkbox" id="btn">
        <label for="btn"><i class="fa-solid fa-bars menu-icon"></i></label>
        

        <nav>
            <ul>
                <li><a href="#">Home </a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
                <li><i class="fas fa-bag-shopping"></i></li>
            </ul>
        </nav>
    </header>

</body>
</html>
